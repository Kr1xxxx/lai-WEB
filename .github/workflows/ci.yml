# CI for 来财Lai. Policy: docs/DECISIONS.md D-014, AGENTS.md "Merging".
# tests → browser end-to-end → mac build + integration (cadence: D-016) → handoff updated → merge policy.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the (expensive) macOS job runs: scripts/mac-cadence.mjs, docs/DECISIONS.md D-016.
  changes:
    name: changed files
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.check.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: node scripts/mac-cadence.mjs
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:model
      - run: python3 -m unittest discover -s tests -p 'test_release_tools.py' -v

  e2e:
    name: browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Playwright stays out of package.json (the repo has no npm dependencies).
      - run: npm install --no-save --no-package-lock playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  mac:
    name: mac build + integration
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Toolchain versions
        run: |
          sw_vers
          node --version
          /usr/bin/swift --version
      # build.py also runs the Swift tests (LaiCoreTests, LaiInstanceTests), then bundles and ad-hoc signs the app.
      - name: Build app
        run: python3 scripts/build.py --node-runtime "$(command -v node)"
      # evidence/ is ignored by git, so a clean checkout lacks it; the script writes its report there.
      - name: Integration test
        run: |
          mkdir -p evidence
          node scripts/integration-test.mjs
      - name: Package app
        run: ditto -c -k --keepParent "dist/来财Lai.app" Lai-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lai-app-${{ github.event.pull_request.head.sha || github.sha }}
          path: Lai-app.zip
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/integration-report.json
          retention-days: 14
          if-no-files-found: ignore

  handoff:
    name: handoff updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/check-handoff.mjs
        env:
          BASE_REF: origin/${{ github.base_ref }}

  # D-014: small changes merge themselves once every check is green; big ones wait for the owner's 合并.
  merge-policy:
    name: merge policy
    needs: [changes, tests, e2e, mac, handoff]
    if: >-
      always() && github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.result == 'success' && needs.tests.result == 'success' && needs.e2e.result == 'success' &&
      needs.handoff.result == 'success' && (needs.mac.result == 'success' || needs.mac.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Read labels now (not from the event) so a "major" label added after opening still counts.
      - id: labels
        run: echo "json=$(gh pr view "$PR" --json labels --jq '[.labels[].name]')" >> "$GITHUB_OUTPUT"
      - id: size
        run: node scripts/classify-pr.mjs
        env:
          BASE_REF: origin/${{ github.base_ref }}
          LABELS: ${{ steps.labels.outputs.json }}
      - name: Small change → merge
        if: steps.size.outputs.size == 'small'
        run: |
          gh pr edit "$PR" --remove-label needs-owner || true
          gh pr edit "$PR" --add-label auto-merged
          gh pr merge "$PR" --merge --delete-branch
      # Merges made with the workflow token do not start a CI run on main, so start the Mac build here
      # when this merge is a 10th Claude PR (D-016).
      - name: Mac build on main every 10th Claude PR
        if: steps.size.outputs.size == 'small'
        run: |
          git fetch origin main:refs/remotes/origin/main
          MAIN_REF=origin/main node scripts/mac-cadence.mjs after-merge
          if MAIN_REF=origin/main node scripts/mac-cadence.mjs after-merge | grep -q 'due: true'; then
            gh workflow run ci.yml --ref main
          fi
      - name: Big change → wait for the owner
        if: steps.size.outputs.size == 'big'
        run: |
          gh pr edit "$PR" --add-label needs-owner
          echo "::notice::Waiting for the owner to say 合并 (merge)."
